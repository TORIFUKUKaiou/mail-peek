[project]
name = "mail-peek"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Awesome YAMAUCHI", email = "torifuku.kaiou@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
mail-peek = "mail_peek:main"

[tool.uv]
exclude-newer = "7 days"

[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
